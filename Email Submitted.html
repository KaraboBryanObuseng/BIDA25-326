<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Submitted</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    animation: slideUp 0.8s ease;
}

.icon {
    font-size: 60px;
    margin-bottom: 20px;
    animation: bounce 1s ease;
}

h2 {
    margin-bottom: 10px;
}

p {
    color: #666;
}

.btn {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    background: #333;
    color: white;
    border-radius: 25px;
    cursor: pointer;
}

/* Animations */
@keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes bounce {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">
    <div class="icon">📩</div>
    <h2>Email Sent!</h2>
    <p>We’ve received your message. We’ll get back to you soon.</p>

    <button class="btn" onclick="goHome()">Back to Menu</button>
</div>

<script>
function goHome() {
    window.location.href = "index.html#bottom";
}
</script>

</body>
</html>
