<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapandel Inc. - Contact Us</title>
    <link rel="stylesheet" href="Contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
   
    <a href="index.html" class="back-home">
        <img src="Back Arrow.png" alt="Back">
    </a>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">CONTACT US</h1>
            </div>
        </div>
    </section>

    <!-- CONTACT INFO SECTION -->
    <section class="contact-info-section">
        <div class="container">
            <div class="section-title">
                <h2>Get in touch with us!</h2>
            </div>
            
            <div class="contact-grid">
                <!-- Phone -->
                <div class="contact-item">
                    <div class="contact-icon phone">📱</div>
                    <div class="contact-details">
                        <h3>Phone</h3>
                        <p>+267 388 1234</p>
                    </div>
                </div>

                <!-- Address -->
                <div class="contact-item">
                    <div class="contact-icon location">📍</div>
                    <div class="contact-details">
                        <h3>Address</h3>
                        <p>Riverwalk Mall, Botswana, Gaborone</p>
                    </div>
                </div>

                <!-- Email -->
                <div class="contact-item">
                    <div class="contact-icon email">📧</div>
                    <div class="contact-details">
                        <h3>Email</h3>
                        <p>Brews@gmail.com</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTACT FORM SECTION -->
    <section class="contact-form-section">
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <p>IF YOU HAVE ANY QUESTIONS</p>
                    <h3>Please Do Not Hesitate To Send Us A Message.</h3>
                </div>
                
                <form class="contact-form">
                    <div class="form-group">
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- MAP SECTION -->
    <section class="map-section">
        <div class="map-container">
            <!-- Map Image -->
            <img src="MAP.png" alt="Map" style="width:100%; height:400px; border:0;">
        </div>
    </section>

     <!-- Footer -->
  <footer class="footer-custom text-center py-4">
    <video width="110" height="110" autoplay loop muted playsinline>
      <source src="SpinningBean.mp4" type="video/mp4">
    </video>
    <p>&copy; 2026 Brews. All rights reserved. | Made with ☕ & ❤️</p>
  </footer>
</body>
</html>
