<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    color: white;
}

.container {
    text-align: center;
}

/* Circle */
.circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 5px solid white;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 20px;
    animation: pop 0.5s ease;
}

/* SVG Tick */
.checkmark {
    width: 60px;
    height: 60px;
}

.checkmark path {
    stroke: white;
    stroke-width: 5;
    fill: none;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw 0.6s ease forwards;
}

/* Text */
h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

p {
    opacity: 0.9;
}

/* Button */
.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    background: white;
    color: #2E7D32;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}

/* Animations */
@keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
}

@keyframes draw {
    to { stroke-dashoffset: 0; }
}
</style>
</head>

<body>

<div class="container">
    
    <div class="circle">
        <svg class="checkmark" viewBox="0 0 52 52">
            <path d="M14 27 L22 35 L38 18"></path>
        </svg>
    </div>

    <h1>Payment Successful!</h1>
    <p>Your order has been placed successfully.</p>

    <button class="btn" onclick="goOrder()">Go Back</button>
</div>

<script>
function goOrder() {
    window.location.href = "Order.html";
}
</script>

</body>
</html>
